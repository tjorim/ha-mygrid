name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-mygrid
    steps:
      - uses: actions/checkout@v4
        with:
          path: ha-mygrid
      # Development override until mygrid-modbus 0.1.0 is published on PyPI.
      - uses: actions/checkout@v4
        with:
          repository: tjorim/mygrid-modbus
          ref: 81d32f6856cad066bfe4385b07a4371fb1dacc6b
          path: mygrid-modbus
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/validate_metadata.py
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
